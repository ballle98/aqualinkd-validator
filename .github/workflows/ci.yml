name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade --editable '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --tag aqualinkd-validator:test .
      - name: Run doctor
        run: docker run --rm aqualinkd-validator:test doctor --json
      - name: Run panel-free mock daemon
        run: |
          docker run --rm aqualinkd-validator:test run-panel-free \
            --aqualinkd /opt/aqualinkd-validator/test-support/mock-aqualinkd \
            --web-directory /opt/aqualinkd-validator/test-support/web \
            --duration 10 \
            --http-ready-timeout 5 \
            --label ci-mock \
            /opt/aqualinkd-validator/testcases/rs485/probe-ack.yaml
