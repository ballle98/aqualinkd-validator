# Minimal AqualinkD configuration for the local Wine Power Center simulator.
#
# The dotfiles run-aqualinkd-validator-power-center.sh helper replaces the
# serial_port and web_directory values when it renders this template as
# /tmp/aqualinkd-wsl.conf. For a manual run, replace both values yourself.

listen_address = http://127.0.0.1:8081
serial_port = /dev/pts/REPLACE_WITH_AQUALINKD_PTY
web_directory = /home/USER/git/AqualinkD/web/

# PDA Power Center targets override these values in their private derived
# configuration, but keeping PDA-safe defaults makes this file useful for
# manual diagnosis too.
panel_type = PD-8 Combo
device_id = 0x60

enable_scheduler = no
log_level = NOTICE
