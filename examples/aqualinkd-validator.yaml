schema: 1

# Physical characteristics and safety delays for this pool installation.
# The opt-in pda-live-spa suite uses this delay to circulate/fill the spa in
# pool mode before changing to spa mode.
spa:
  fill_time: 8m

# Optional automation for the Jandy Power Center emulator. The validator starts
# Pwrcntr.exe and Simio.exe on a private Xvfb display by default. Connect COM3
# to the serial_port in aqualinkd.conf before selecting a Power Center suite.
# power_center:
#   helper: ../contrib/power-center-helper/build/pwrcntr-control.exe
#   wine_prefix: ~/.wine-aqualink
#   model: "B29231 (16 Combo)"
#   port: COM3
#   startup_timeout: 30s
# The executables default to the Alwin32 directory under wine_prefix. Override
# power_center_executable and simio_executable only for a nonstandard install.
