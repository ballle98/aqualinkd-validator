[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aqualinkd-validator"
version = "0.1.0"
description = "Process-level validation and performance harness for AqualinkD"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Lee Ballard" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[project.scripts]
aqualinkd-validator = "aqualinkd_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aqualinkd_validator"]
