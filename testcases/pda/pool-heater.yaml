schema: 1
id: pda.pool-heater
description: Exercise pool-heater controls at non-heating setpoints
mode: physical-panel
access: read-write
requires:
  protocol: pda
steps:
  - wait_for:
      condition: pda.initialized
      timeout: 180s
  - exercise_heater:
      id: Pool_Heater
      optional: true
      activation_timeout: 130s
      completion_timeout: 90s
      convergence_timeout: 10s
  - assert_no_log:
      contains: Ignoring invalid PDA character highlight
      duration: 100ms
finally:
  - restore_original_state:
      timeout: 300s
