schema: 1
kind: suite
id: pda-live-awake
description: PDA live-panel coverage requiring sleep mode to remain disabled
mode: physical-panel
access: read-write
requires:
  protocol: pda
config:
  aqualinkd_args:
    - -vv
  overrides:
    pda_sleep_mode: no
  execution_role: awake
testcases:
  - ../pda/initialization.yaml
  - ../pda/filter-after-init.yaml
  - ../pda/pool-heater.yaml
  - ../pda/equipment-status.yaml
  - ../pda/consecutive-devices.yaml
